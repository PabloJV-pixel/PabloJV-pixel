<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#A6FF00"/>
      <stop offset="1" stop-color="#7BE000"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Soft lime blobs -->
  <g opacity="0.12" filter="url(#blur)">
    <circle cx="180" cy="90" r="120" fill="#A6FF00"/>
    <circle cx="980" cy="260" r="160" fill="#7BE000"/>
  </g>

  <!-- Left: avatar circle (linked to GitHub avatar) -->
  <defs>
    <clipPath id="avatarClip"><circle cx="110" cy="110" r="58"/></clipPath>
  </defs>
  <g transform="translate(56,56)">
    <rect x="-8" y="-8" width="132" height="132" rx="18" fill="#0f1720" opacity="0.08"/>
    <image x="52" y="52" width="116" height="116" xlink:href="https://github.com/PabloJV-pixel.png" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="110" cy="110" r="58" stroke="url(#accent)" stroke-width="3" fill="none" />
  </g>

  <!-- Center-left: name & tagline -->
  <g transform="translate(240,86)" fill="#E6FDF0">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">PabloJV-Pixel</text>
    <text x="0" y="46" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bfeeb0">Data Science · Learning Python · SQL · Git · Google Colab</text>
  </g>

  <!-- Right: stylized sparkline + scatter (data vibe) -->
  <g transform="translate(640,90)" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="40,160 80,120 120,140 160,90 200,110 240,70 280,90 320,60"
              fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.95"/>
    <g fill="#FFFFFF" opacity="0.95">
      <circle cx="40" cy="160" r="4"/>
      <circle cx="80" cy="120" r="5"/>
      <circle cx="120" cy="140" r="4"/>
      <circle cx="160" cy="90" r="5"/>
      <circle cx="200" cy="110" r="4"/>
      <circle cx="240" cy="70" r="5"/>
      <circle cx="280" cy="90" r="4"/>
      <circle cx="320" cy="60" r="5"/>
    </g>
  </g>

  <!-- Bottom-left: small chips for future projects -->
  <g transform="translate(240,180)" fill="#fff" opacity="0.92" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" rx="8" width="320" height="36" fill="#0f1720" opacity="0.07"/>
    <text x="14" y="24" font-size="13" fill="#dfffc5">Proyectos destacados (próximamente):</text>
  </g>

  <!-- Footer small text -->
  <text x="56" y="344" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9aa5a0">Portafolio · Data Science · Actualizado 2025</text>
</svg>